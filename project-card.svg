<svg xmlns="http://www.w3.org/2000/svg" width="480" height="128" viewBox="0 0 480 128">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2128" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#161b22" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="pubGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#7c3aed" flood-opacity="0.4"/>
    </filter>
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Card body with dark glass fill -->
  <rect x="8" y="8" width="464" height="112" rx="0"
        fill="url(#cardGrad)" filter="url(#shadow)"/>

  <!-- Gradient border outline -->
  <rect x="8" y="8" width="464" height="112" rx="0"
        fill="none" stroke="url(#accentGrad)" stroke-width="1.4" opacity="0.75"/>

  <!-- Top accent bar -->
  <rect x="8" y="8" width="464" height="3" rx="0"
        fill="url(#accentGrad)" filter="url(#glow)"/>

  <!-- Repo icon -->
  <g transform="translate(24, 27)">
    <rect x="0" y="0" width="15" height="12" rx="2"
          fill="none" stroke="#a78bfa" stroke-width="1.4"/>
    <line x1="0" y1="3.5" x2="15" y2="3.5"
          stroke="#a78bfa" stroke-width="0.9" opacity="0.4"/>
    <circle cx="4"   cy="8" r="1" fill="#a78bfa"/>
    <circle cx="7.5" cy="8" r="1" fill="#a78bfa"/>
    <circle cx="11"  cy="8" r="1" fill="#a78bfa"/>
  </g>

  <!-- org/repo name -->
  <text font-family="'SF Mono','Fira Mono',monospace" font-size="13.5" font-weight="700" filter="url(#glow)">
    <tspan x="46" y="38" fill="#94a3b8">kubero-dev/</tspan><tspan fill="#c4b5fd">kubero</tspan>
  </text>

  <!-- Public badge -->
  <rect x="225" y="25" width="44" height="17" rx="3"
        fill="url(#pubGrad)" stroke="rgba(52,211,153,0.5)" stroke-width="1"/>
  <text x="247" y="37"
        font-family="system-ui,sans-serif" font-size="9" font-weight="600"
        text-anchor="middle" fill="#6ee7b7" letter-spacing="0.3">Public</text>

  <!-- Thin divider -->
  <line x1="24" y1="52" x2="456" y2="52"
        stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Description -->
  <text x="24" y="70"
        font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5"
        fill="rgba(203,213,225,0.85)">A free and self-hosted PaaS alternative to Heroku / Netlify / Coolify /</text>
  <text x="24" y="85"
        font-family="'Segoe UI',system-ui,sans-serif" font-size="11.5"
        fill="rgba(203,213,225,0.65)">Vercel / Dokku / Portainer running on Kubernetes.</text>

  <!-- Footer divider -->
  <line x1="24" y1="97" x2="456" y2="97"
        stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Language dot + label -->
  <circle cx="33" cy="112" r="5" fill="#3178c6" filter="url(#dotGlow)"/>
  <text x="44" y="116"
        font-family="system-ui,sans-serif" font-size="11"
        fill="rgba(203,213,225,0.82)">TypeScript</text>

  <!-- Stars -->
  <text x="138" y="116"
        font-family="system-ui,sans-serif" font-size="12"
        fill="rgba(148,163,184,0.5)">&#9734;</text>
  <text x="152" y="116"
        font-family="system-ui,sans-serif" font-size="11"
        fill="rgba(203,213,225,0.75)">4.2k</text>

  <!-- Fork icon -->
  <g transform="translate(192,104)" fill="rgba(148,163,184,0.55)" stroke="none">
    <circle cx="4"   cy="2"  r="1.8"/>
    <circle cx="4"   cy="11" r="1.8"/>
    <circle cx="9.5" cy="2"  r="1.8"/>
    <line x1="4" y1="3.8" x2="4" y2="9.2"
          stroke="rgba(148,163,184,0.55)" stroke-width="1.2"/>
    <path d="M9.5 3.8 Q9.5 7 4 9.2"
          stroke="rgba(148,163,184,0.55)" stroke-width="1.2" fill="none"/>
  </g>
  <text x="207" y="116"
        font-family="system-ui,sans-serif" font-size="11"
        fill="rgba(203,213,225,0.75)">194</text>
</svg>